repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-files
          - '(^|/)(LICENSE|CLAUDE\.md|\.env\.example|scripts/check_secrets\.py)$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbidden-token-literals
        name: forbidden token literal scan
        entry: python scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
